# Each season's format (decided in #11; see GLOSSARY.md). Hand-kept: for past
# seasons it records what was actually played. Every season the archive holds
# must have an entry, or the build fails; a season may be written down ahead.
#
#   teams                 how many franchises played (checked against the archive)
#   divisions             how many divisions
#   realignment           the first season of the division cycle this season
#                         belongs to (the divisions are redrawn when it changes)
#   regular_season_weeks  first and last week of the regular season
#   tiebreaks             how level franchises are separated for seeding
#   brackets              each bracket's size, the weeks it plays (one per
#                         round), how it is seeded and, for a series, how it is won
#
# NFL.com-era (2012-2024) seeds are as NFL.com reported them: it applied its
# own tiebreaks, and nobody recalculates them. From 2025 the written rules
# (playoffs.md) apply, and the build will check its seeds against the
# brackets played (ADR 0005).

x-nfl-tiebreaks: &nfl-tiebreaks NFL.com's own, as it reported the seeds
x-rules-tiebreaks: &rules-tiebreaks >-
  Win %, a tie counting half. Two franchises: head-to-head, then divisional
  record if they share a division, then Breakdown, then scissors-paper-rock.
  Three or more: divisional record if all share a division, then Breakdown,
  then scissors-paper-rock. The Shit Bowl uses the reverse.

x-nfl-4: &nfl-4
  playoffs: {size: 4, weeks: [15, 16], seeding: "The top 4 as NFL.com seeded them: 1 v 4 and 2 v 3, the winners meet"}
  shit_bowl: {size: 4, weeks: [15, 16], seeding: "The bottom 4; losing advances. NFL.com did not run it, so its pairings are not recorded"}
x-nfl-6-from-14: &nfl-6-from-14
  playoffs: {size: 6, weeks: [14, 15, 16], seeding: "As NFL.com seeded them: seeds 1 and 2 bye, 3 v 6 and 4 v 5, then re-seeded so seed 1 meets the lowest seed left"}
  shit_bowl: {size: 6, weeks: [14, 15, 16], seeding: "The bottom 6; losing advances. NFL.com did not run it, so its pairings are not recorded"}
  mediocre_bowl: {size: 4, weeks: [14, 15], seeding: "The middle 4. NFL.com did not run it, so its pairings are not recorded"}
x-nfl-6-from-15: &nfl-6-from-15
  playoffs: {size: 6, weeks: [15, 16, 17], seeding: "As NFL.com seeded them: seeds 1 and 2 bye, 3 v 6 and 4 v 5, then re-seeded so seed 1 meets the lowest seed left"}
  shit_bowl: {size: 6, weeks: [15, 16, 17], seeding: "The bottom 6; losing advances. NFL.com did not run it, so its pairings are not recorded"}
  mediocre_bowl: {size: 4, weeks: [15, 16], seeding: "The middle 4. NFL.com did not run it, so its pairings are not recorded"}

