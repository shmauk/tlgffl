# Each season's format (decided in #11; see GLOSSARY.md). Hand-kept: for past
# seasons it records what was actually played.
#
#   teams                 how many franchises played (checked against the archive)
#   divisions             how many divisions
#   regular_season_weeks  first and last week of the regular season
#   brackets              each bracket's size, the weeks it plays and, for a
#                         series, how it is won
#
# Seeding, tiebreaks and realignment cycles are still to be added (#23).

2012:
  teams: 10
  divisions: 1
  regular_season_weeks: [1, 14]
  brackets:
    playoffs: {size: 4, weeks: [15, 16]}
    shit_bowl: {size: 4, weeks: [15, 16]}
