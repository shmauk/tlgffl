<!doctype html>
<!--
  PROTOTYPE — throwaway. Statsguru for The Fantasy League (shmauk/tlgffl#9).
  Three structurally different variants of one query tool, switchable via ?variant=A|B|C
  (bottom bar, or ← / →). All three share one query engine and real ff-data-project data,
  and each writes the query into the URL in a different shape so URL styles can be compared.
  Regenerate: python3 extract.py <ff-data-project> data.json && python3 inline.py
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Statsguru — PROTOTYPE</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 -apple-system, system-ui, sans-serif; color: #1d1d1f; background: #fff; padding-bottom: 80px; }
  a { color: #0b57d0; }
  table { border-collapse: collapse; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: #888; }
  .site { background: #1f3b2c; color: #fff; padding: 10px 24px; display: flex; gap: 24px; align-items: baseline; }
  .site b { font-size: 18px; }
  .site span { opacity: .75; }
  .url { font: 12px ui-monospace, monospace; background: #f4f4f4; border: 1px solid #ddd; padding: 6px 8px; word-break: break-all; }

  /* ---------- switcher ---------- */
  #switcher { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #111; color: #fff;
    border-radius: 999px; padding: 6px 10px; display: flex; gap: 10px; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.35);
    font: 13px ui-monospace, monospace; z-index: 99; }
  #switcher button { background: #333; color: #fff; border: 0; border-radius: 999px; width: 28px; height: 28px; cursor: pointer; font-size: 14px; }
  #switcher .tag { background: #e8b400; color: #111; border-radius: 4px; padding: 1px 5px; font-weight: bold; }

  /* ---------- A: classic ---------- */
  .A { max-width: 1100px; margin: 0 auto; padding: 16px 24px; font-family: Verdana, Geneva, sans-serif; font-size: 12px; }
  .A h1 { font-size: 20px; margin: 4px 0 12px; }
  .A fieldset { border: 1px solid #ccc; margin: 0 0 10px; padding: 8px 12px; }
  .A legend { font-weight: bold; color: #1f3b2c; }
  .A .row { display: grid; grid-template-columns: 160px 1fr; gap: 6px 12px; align-items: center; margin: 4px 0; }
  .A label.inline { margin-right: 12px; white-space: nowrap; }
  .A select[multiple] { height: 110px; min-width: 260px; }
  .A .submit { background: #1f3b2c; color: #fff; border: 0; padding: 6px 18px; font-weight: bold; cursor: pointer; }
  .A .summary { background: #eef3ef; border-left: 4px solid #1f3b2c; padding: 6px 10px; margin: 10px 0; }
  .A table.res { width: 100%; font-size: 12px; }
  .A table.res th { background: #1f3b2c; color: #fff; padding: 4px 6px; text-align: left; white-space: nowrap; }
  .A table.res th a { color: #fff; text-decoration: none; }
  .A table.res th.sorted { background: #3b6b50; }
  .A table.res td { padding: 3px 6px; border-bottom: 1px solid #e4e4e4; white-space: nowrap; }
  .A table.res tr:nth-child(even) td { background: #f7f7f7; }
  .A .fn { color: #b00; font-weight: bold; }
  .A .footnotes { margin-top: 10px; font-size: 11px; color: #444; }
  .A .footnotes div { margin: 2px 0; }

  /* ---------- B: sentence ---------- */
  .B { max-width: 1000px; margin: 0 auto; padding: 28px 24px; }
  .B .sentence { font-size: 24px; line-height: 2.1; font-weight: 300; }
  .B .pill { display: inline-block; position: relative; font-weight: 600; color: #0b57d0; border-bottom: 2px dashed #0b57d0; cursor: pointer; line-height: 1.2; }
  .B .pop { position: absolute; top: 110%; left: 0; background: #fff; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.15);
    padding: 10px; z-index: 10; font-size: 13px; font-weight: 400; color: #222; line-height: 1.6; max-height: 340px; overflow: auto; min-width: 240px; }
  .B .pop label { display: block; white-space: nowrap; }
  .B .strip { display: flex; gap: 3px; margin: 22px 0 6px; }
  .B .strip div { flex: 1; text-align: center; font-size: 11px; }
  .B .strip .bar { height: 22px; border-radius: 3px; margin-bottom: 3px; }
  .B .full { background: #2e7d32; } .B .partial { background: repeating-linear-gradient(45deg,#2e7d32 0 6px,#c8e6c9 6px 12px); }
  .B .reported { background: #c8e6c9; } .B .none { background: #eee; }
  .B .off .bar { opacity: .15; } .B .off { color: #bbb; }
  .B .legend span { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin: 0 4px 0 12px; }
  .B .missing-note { background: #fff8e1; border: 1px solid #f0d78c; border-radius: 8px; padding: 10px 14px; margin: 12px 0 18px; }
  .B table.res { width: 100%; }
  .B table.res th { text-align: left; font-weight: 600; color: #666; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; padding: 6px 8px; border-bottom: 2px solid #222; cursor: pointer; white-space: nowrap; }
  .B table.res td { padding: 7px 8px; border-bottom: 1px solid #eee; white-space: nowrap; }
  .B .metric { position: relative; }
  .B .metric i { position: absolute; left: 0; top: 4px; bottom: 4px; background: #e3ecfb; z-index: -1; border-radius: 2px; }
  .B .partialcell { border-bottom: 1px dotted #b26a00; cursor: help; }
  .B .badge { display: inline-block; background: #eee; color: #555; border-radius: 10px; padding: 0 8px; font-size: 11px; margin-left: 6px; }
  .B .badge.warn { background: #fff0c2; color: #8a5a00; }
  .B .share { margin-top: 18px; }

  /* ---------- C: workbench ---------- */
  .C { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 40px); }
  .C aside { background: #f6f7f9; border-right: 1px solid #e2e4e8; padding: 12px; overflow: auto; max-height: calc(100vh - 40px); position: sticky; top: 0; }
  .C aside h4 { margin: 14px 0 4px; font-size: 11px; text-transform: uppercase; color: #667; letter-spacing: .05em; display: flex; justify-content: space-between; }
  .C aside h4 a { font-weight: 400; text-transform: none; font-size: 11px; cursor: pointer; }
  .C aside label { display: flex; justify-content: space-between; font-size: 13px; padding: 1px 2px; cursor: pointer; border-radius: 3px; }
  .C aside label:hover { background: #e9ebef; }
  .C aside label .c { color: #99a; font-size: 11px; }
  .C aside label.zero { color: #bbb; }
  .C main { padding: 12px 20px; min-width: 0; }
  .C .tabs { display: flex; gap: 2px; border-bottom: 1px solid #ccd; margin-bottom: 12px; }
  .C .tabs button { border: 0; background: none; padding: 8px 14px; cursor: pointer; font-size: 13px; border-bottom: 3px solid transparent; }
  .C .tabs button.on { border-color: #0b57d0; color: #0b57d0; font-weight: 600; }
  .C .heat { display: grid; gap: 1px; font-size: 10px; margin-bottom: 4px; }
  .C .heat div { height: 14px; }
  .C .heat .lbl { color: #667; text-align: right; padding-right: 4px; cursor: pointer; }
  .C .heat .lbl:hover { color: #0b57d0; }
  .C .h-s { background: #3f7ad8; } .C .h-r { background: #b9cdf0; } .C .h-x { background: repeating-linear-gradient(45deg,#ddd 0 3px,#fff 3px 6px); }
  .C .h-o { background: #a0e0b0; } .C .h-n { background: transparent; } .C .h-dim { opacity: .15; }
  .C table.res { width: 100%; font-size: 13px; }
  .C table.res th { position: sticky; top: 0; background: #fff; border-bottom: 1px solid #ccd; padding: 5px 8px; text-align: left; cursor: pointer; white-space: nowrap; font-weight: 600; }
  .C table.res td { padding: 4px 8px; border-bottom: 1px solid #f0f0f3; white-space: nowrap; }
  .C .cov { display: inline-flex; width: 90px; height: 8px; border-radius: 2px; overflow: hidden; background: #eee; vertical-align: middle; }
  .C .cov i { display: block; height: 100%; }
  .C .matrix td, .C .matrix th { width: 34px; height: 26px; text-align: center; font-size: 11px; padding: 0; border: 1px solid #fff; }
  .C .matrix th.r { text-align: right; width: auto; padding-right: 6px; white-space: nowrap; }
  .C .matrix th.c { writing-mode: vertical-rl; transform: rotate(180deg); height: 120px; vertical-align: bottom; font-weight: 400; }
  .C .bar-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
</style>

      if (k === 'phase') q.ph = v.split(',').map(p => ({ regular: 'R', playoffs: 'P', consolation: 'C' })[p]);
      if (k === 'weeks') [q.w0, q.w1] = v.split('-').map(Number);
      if (k === 'result') q.res = { won: 'W', lost: 'L', tied: 'T' }[v];
      if (k === 'active') q.act = true;
      if (k === 'min-games') q.min = +v;
      if (k === 'view') q.view = v;
      if (k === 'sort') { q.dir = v.startsWith('-') ? 'desc' : 'asc'; q.sort = v.replace('-', ''); }
    }
  } else if (s.includes(';') || /type=franchise/.test(s)) {
    let smin, smax; const seasons = [], ph = [];
    q.f = []; q.o = [];
    for (const kv of s.split(';')) {
      const [k, v] = kv.split('=');
      if (k === 'franchise') q.f.push(+v);
      if (k === 'opposition') q.o.push(+v);
      if (k === 'orderby') q.sort = v;
      if (k === 'orderbyad') q.dir = v === 'ascending' ? 'asc' : 'desc';
      if (k === 'phase') ph.push(v);
      if (k === 'qualmin1') q.min = +v;
      if (k === 'result') q.res = { 1: 'W', 2: 'L', 3: 'T' }[v];
      if (k === 'spanmin1') smin = +v; if (k === 'spanmax1') smax = +v;
      if (k === 'season') seasons.push(+v);
      if (k === 'view') q.view = v;
      if (k === 'weekmin') q.w0 = +v; if (k === 'weekmax') q.w1 = +v;
      if (k === 'active') q.act = true;
    }
    if (ph.length) q.ph = ph;
    if (smin) q.s = SEASONS.filter(y => y >= smin && y <= smax);
    if (seasons.length) q.s = seasons;
  } else {
    const p = new URLSearchParams(s);
    if (p.get('f')) q.f = p.get('f').split(',').map(Number);
    if (p.get('o')) q.o = p.get('o').split(',').map(Number);
    if (p.get('s')) q.s = parseYears(p.get('s'));
    if (p.get('ph')) q.ph = p.get('ph').split(',');
    if (p.get('wk')) [q.w0, q.w1] = p.get('wk').split('-').map(Number);
    if (p.get('res')) q.res = p.get('res');
    if (p.get('active')) q.act = true;
    if (p.get('min')) q.min = +p.get('min');
    if (p.get('view')) q.view = p.get('view');
    if (p.get('sort')) [q.sort, q.dir] = p.get('sort').split('.');
  }
  return q;
}

    <h4>Franchises</h4><label><span><input type="checkbox" data-act ${Q.act ? 'checked' : ''}> active only</span></label>
    ${facet('Franchise', 'f', FIDS, cf, fname, Q.f)}
    ${facet('Opponent', 'o', FIDS, co, fname, Q.o)}
    ${facet('Phase', 'ph', ['R', 'P', 'C'], cp, p => PH[p], Q.ph)}
    ${facet('Season', 's', SEASONS, cs, y => y + (y === 2025 ? ' · Sleeper' : ''), Q.s.length === SEASONS.length ? [] : Q.s)}
    ${facet('Result', 'res', ['W', 'L', 'T'], cr, r => ({ W: 'Won', L: 'Lost', T: 'Tied' })[r], Q.res ? [Q.res] : [])}
    <h4>Weeks</h4><div style="font-size:13px"><input type="number" data-wk="w0" value="${Q.w0}" style="width:48px"> – <input type="number" data-wk="w1" value="${Q.w1}" style="width:48px"></div>
    <h4>Min. games</h4><input type="number" data-min value="${Q.min}" style="width:60px">
  </aside>`;
  // Coverage heatmap: season × week, the query's footprint over what exists.
  const maxWk = 17;
  let heat = `<div class="heat" style="grid-template-columns: 40px repeat(${maxWk}, 1fr)"><div></div>${[...Array(maxWk)].map((_, i) => `<div class="muted" style="text-align:center">${i + 1}</div>`).join('')}`;
  for (const y of SEASONS) {
    const c = DATA.coverage[y], inS = Q.s.includes(y);
    heat += `<div class="lbl" data-year="${y}" title="Only ${y}">${y}</div>`;
    for (let w = 1; w <= maxWk; w++) {
      let cls = 'h-n', tip = '';
      if (w <= c.regWeeks) { cls = c.regScored.includes(w) ? 'h-s' : 'h-r'; tip = c.regScored.includes(w) ? 'scored' : 'season totals only'; }
      else if (w <= c.regWeeks + 3) {
        const po = DATA.games.filter(g => g[0] === y && g[1] === w && g[2] !== 'R');
        if (po.length) { cls = po.some(g => g[4] === null) ? 'h-x' : 'h-o'; tip = po.some(g => g[4] === null) ? 'bracket results, no scores' : 'bracket games scored'; }
        else if (y >= 2022 && y <= 2024) { cls = 'h-x'; tip = 'bracket results, no scores'; }
      }
      const inQ = inS && w >= Q.w0 && w <= Q.w1;
      heat += `<div class="${cls} ${inQ ? '' : 'h-dim'}" title="${y} wk ${w}: ${tip}"></div>`;
    }
  }
  heat += '</div><div class="muted" style="font-size:11px;margin-bottom:10px"><span class="h-s" style="display:inline-block;width:10px;height:10px"></span> regular season, scored &nbsp; <span class="h-r" style="display:inline-block;width:10px;height:10px"></span> season totals only &nbsp; <span class="h-o" style="display:inline-block;width:10px;height:10px"></span> bracket scored &nbsp; <span class="h-x" style="display:inline-block;width:10px;height:10px"></span> bracket, result only · faded = outside query · click a season to isolate it</div>';

  let table;
  if (Q.view === 'opp' && !Q.f.length) {
    // Head-to-head matrix: franchise rows × opponent columns, win % shaded.
    const ids = FIDS.filter(id => out.some(r => r.f === id));
    const cell = {}; for (const r of out) cell[r.f + '|' + r.o] = r;
    table = `<table class="matrix"><tr><th></th>${ids.map(id => `<th class="c">${esc(fname(id))}</th>`).join('')}</tr>` +
      ids.map(a => `<tr><th class="r">${esc(fname(a))}</th>${ids.map(b => {
        const r = cell[a + '|' + b]; if (!r) return '<td style="background:#fafafa"></td>';
        const p = r.pct, bg = `hsl(${p * 120},60%,${85 - Math.abs(p - .5) * 40}%)`;
        return `<td style="background:${bg}" title="${esc(F[a].name)} v ${esc(F[b].name)}: ${r.w}-${r.l}-${r.t}">${r.w}-${r.l}${r.t ? '-' + r.t : ''}</td>`;
      }).join('')}</tr>`).join('') + '</table><div class="muted" style="font-size:11px">Pick one franchise to get the opponent list instead. Head-to-head only covers games with surviving detail.</div>';
  } else {
    const covCell = r => {
      if (r.kind) return '';
      const tot = r.gp + r.miss, seg = (n, c) => n ? `<i style="width:${n / tot * 100}%;background:${c}"></i>` : '';
      return `<span class="cov" title="${r.sn} scored · ${r.rep} season totals only · ${r.ro} result only · ${r.miss} unknown">${seg(r.sn, '#3f7ad8')}${seg(r.rep, '#b9cdf0')}${seg(r.ro, '#a0e0b0')}${seg(r.miss, '#e57373')}</span>`;
    };
    table = `<table class="res"><thead><tr>${cols.map(([k, l]) => `<th data-sort="${k}" class="${NUMERIC.has(k) ? 'num' : ''}">${l}${Q.sort === k ? (Q.dir === 'desc' ? ' ▾' : ' ▴') : ''}</th>`).join('')}${Q.view === 'games' ? '' : '<th>Coverage</th>'}</tr></thead><tbody>` +
      out.slice(0, 500).map(r => r.kind === 'gap'
        ? `<tr style="background:repeating-linear-gradient(45deg,#fafafa 0 6px,#f0f0f0 6px 12px)"><td>${r.y}</td><td>${r.wk}–${r.wkTo}</td><td>${PH.R}</td><td>${esc(fname(r.f))}</td><td colspan="5" class="muted">${r.n} games without detail${r.g.w != null ? ` (season totals: ${r.g.w}-${r.g.l}-${r.g.t})` : ''}</td></tr>`
        : '<tr>' + cols.map(([k]) => `<td class="${NUMERIC.has(k) ? 'num' : ''}">${(Q.view === 'games' && (k === 'pf' || k === 'pa') && !r.scored) ? '<span class="muted">n/a</span>' : esc(fmt(k, r[k], r))}</td>`).join('') + (Q.view === 'games' ? '' : `<td>${covCell(r)}</td>`) + '</tr>').join('') + '</tbody></table>';
  }
  app.innerHTML = `<div class="C">${side}<main>
    <div class="tabs">${Object.entries({ agg: 'Totals', season: 'Seasons', opp: 'Head-to-head', phase: 'By phase', games: 'Game log' }).map(([k, v]) => `<button data-view="${k}" class="${Q.view === k ? 'on' : ''}">${v}</button>`).join('')}</div>
    ${heat}
    <div class="bar-top"><span class="muted">${out.length} rows</span><span class="url" style="flex:1">${esc(shareUrl())}</span><button id="reset">Reset</button></div>
    ${table}</main></div>`;
  app.querySelectorAll('[data-view]').forEach(b => b.onclick = () => set({ view: b.dataset.view }));
  app.querySelectorAll('[data-sort]').forEach(th => th.onclick = () => sortBy(th.dataset.sort));
  app.querySelectorAll('[data-year]').forEach(l => l.onclick = () => set({ s: Q.s.length === 1 && Q.s[0] === +l.dataset.year ? [...SEASONS] : [+l.dataset.year] }));
  app.querySelectorAll('[data-fac]').forEach(cb => cb.onchange = () => {
    const k = cb.dataset.fac;
    const vals = [...app.querySelectorAll(`[data-fac="${k}"]:checked`)].map(x => k === 'ph' || k === 'res' ? x.value : +x.value);
    if (k === 'res') set({ res: cb.checked ? cb.value : '' });
    else if (k === 's') set({ s: vals.length ? vals : [...SEASONS] });
    else if (k === 'ph') set({ ph: vals.length ? vals : ['R', 'P', 'C'] });
    else set({ [k]: vals });
  });
  app.querySelectorAll('[data-clear]').forEach(a => a.onclick = () => { const k = a.dataset.clear; set({ [k]: k === 's' ? [...SEASONS] : k === 'res' ? '' : [] }); });
  app.querySelector('[data-act]').onchange = e => set({ act: e.target.checked });
  app.querySelectorAll('[data-wk]').forEach(i => i.onchange = () => set({ [i.dataset.wk]: +i.value }));
  app.querySelector('[data-min]').onchange = e => set({ min: +e.target.value });
  document.getElementById('reset').onclick = () => { Q = DEFAULT(); writeUrl(); render(); };
}

writeUrl();
render();
</script>
</body>
</html>
