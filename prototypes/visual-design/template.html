<!doctype html>
<!--
  PROTOTYPE (throwaway, never merged). Answers "Visual design: the site's look across
  records, profiles and Statsguru" (shmauk/tlgffl#15).
  Three radically different visual directions, switchable via ?variant=A|B|C, each rendering
  three pages via ?page=records|franchise|statsguru. Real ff-data-project data.
  The prototype treats 2025 as "this season" (the data stops there).
-->
<html lang="en">

<body>
<div id="app"></div>
<div id="proto-bar"></div>
<script>
const D = __DATA__;
const CUR = 2025; // PROTOTYPE: the data stops at 2025, so it plays "this season"
const P = new URLSearchParams(location.search);
const VARIANTS = { A: 'Scorecard', B: 'Almanack', C: 'Night desk', D: 'Broadsheet', E: 'Ceefax', F: 'Swiss', G: 'Sidenotes', H: 'Ledger', I: 'Programme', J: 'Almanack, yellow jacket', K: 'Almanack by lamplight' };
const PAGES = { records: 'Record list', franchise: 'Franchise profile', statsguru: 'Statsguru results' };
let variant = VARIANTS[P.get('variant')] ? P.get('variant') : 'A';
let page = PAGES[P.get('page')] ? P.get('page') : 'records';

const F = {}; D.franchises.forEach(f => F[f.id] = f);
const ID = {}; D.franchises.forEach(f => ID[f.name] = f.id);
const GAP = new Set(Object.entries(D.coverage).filter(([, c]) => c.regScored.length < c.regWeeks).map(([s]) => +s));
const NOTE = {
  '†': "Includes NFL.com's reported season totals for weeks with no game scores (2022 wk 10 – 2024). Wins, losses and points are complete; game-level figures are not.",
  '‡': 'Playoff result known but the score is lost, so the game is left out of points.',
  '*': 'Highs and lows only come from games with scores.',
  '§': "A week, opponent or result filter can't be checked against games with no detail, so those games are left out, not estimated.",
  '¶': 'Lineups and NFL players only exist from 2025 on.',
};

// ---------- helpers ----------
const url = over => { const q = new URLSearchParams(location.search); for (const [k, v] of Object.entries(over)) v == null ? q.delete(k) : q.set(k, v); return '?' + q; };
const fUrl = id => url({ page: 'franchise', f: id, sort: null });
const n2 = x => x.toFixed(2);
const pct = x => (x * 100).toFixed(1);
const wlt = o => `${o.w}-${o.l}-${o.t}`;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const mk = (g) => `<span class="mk" title="${esc(NOTE[g])}">${g}</span>`;
const fname = id => esc(F[id].name);
const seasonLink = s => `<a href="#" title="Season page (not in this prototype)">${s}</a>`;

// ---------- Breakdown per season-franchise (fully covered seasons only) ----------
const BD = {};
(() => {
  const wk = {};
  D.games.forEach(([s, w, ph, a, pa, b, pb]) => { if (ph !== 'R' || pa == null || GAP.has(s)) return; (wk[s + '-' + w] ||= []).push([a, pa], [b, pb]); });
  for (const k in wk) {
    const s = +k.split('-')[0], arr = wk[k];
    arr.forEach(([f, sc]) => { const o = BD[s + '-' + f] ||= { w: 0, l: 0, t: 0 }; arr.forEach(([g, sc2]) => { if (g === f) return; sc > sc2 ? o.w++ : sc < sc2 ? o.l++ : o.t++; }); });
  }
})();

// ---------- view models ----------
function recordVM() {
  const era = P.get('era') || 'all';
  let L = D.lines.filter(l => era === 'all' || (era === 'nfl' ? l[0] < 2025 : l[0] >= 2025))
    .map(l => ({ s: l[0], f: l[1], team: l[2], w: l[3], l: l[4], t: l[5], pf: l[6], pa: l[7], gp: l[3] + l[4] + l[5] }));
  L.sort((a, b) => a.w - b.w || a.s - b.s);
  const cut = L[Math.min(9, L.length - 1)].w;
  const rows = L.filter(x => x.w <= cut);
  rows.forEach(r => {
    r.rank = rows.findIndex(x => x.w === r.w) + 1; r.tied = rows.filter(x => x.w === r.w).length > 1;
    r.gap = GAP.has(r.s); r.now = r.s === CUR; r.dep = !F[r.f].active; r.pct = (r.w + r.t / 2) / r.gp; r.ppg = r.pf / r.gp;
  });
  return { era, rows, used: rows.some(r => r.gap) ? ['†'] : [] };
}

function profileVM(fid) {
  const fr = F[fid];
  const seasons = D.lines.filter(l => l[1] === fid).sort((a, b) => a[0] - b[0]).map(l => {
    const o = { s: l[0], team: l[2], w: l[3], l: l[4], t: l[5], pf: l[6], pa: l[7], po: l[8] };
    o.gp = o.w + o.l + o.t; o.gap = GAP.has(o.s); o.now = o.s === CUR; o.bd = BD[o.s + '-' + fid] || null;
    if (o.bd) { const n = o.bd.w + o.bd.l + o.bd.t; o.bdPct = (o.bd.w + o.bd.t / 2) / n; o.luck = (o.w + o.t / 2) / o.gp - o.bdPct; }
    return o;
  });
  const c = { w: 0, l: 0, t: 0, pf: 0, pa: 0, gp: 0, bw: 0, bl: 0, bt: 0, po: 0 };
  seasons.forEach(o => { c.w += o.w; c.l += o.l; c.t += o.t; c.pf += o.pf; c.pa += o.pa; c.gp += o.gp; c.po += o.po ? 1 : 0; if (o.bd) { c.bw += o.bd.w; c.bl += o.bd.l; c.bt += o.bd.t; } });
  c.pct = (c.w + c.t / 2) / c.gp; c.bdPct = (c.bw + c.bt / 2) / (c.bw + c.bl + c.bt);
  // PROTOTYPE: 2022–24 Shit Bowl winners were never recorded as games, so they play "recalled"; 2021's two names play "disputed"
  const sb = Object.entries(D.shitbowl).filter(([, names]) => names.includes(fr.name)).map(([s, names]) => ({
    s: +s, disputed: names.length > 1, recalled: names.length === 1 && +s >= 2022, others: names.filter(n => n !== fr.name).map(n => ID[n]),
  }));

  const games = [], lost = [];
  D.games.forEach(([s, w, ph, a, pa, b, pb]) => {
    if (a !== fid && b !== fid) return;
    const me = a === fid, pts = me ? pa : pb, opp = me ? b : a, op = me ? pb : pa;
    if (pts == null) { lost.push({ s, w, ph, opp }); return; }
    games.push({ s, w, ph, pts, opp, op, res: pts > op ? 'W' : pts < op ? 'L' : 'T' });
  });
  const best = [...games].sort((a, b) => b.pts - a.pts).slice(0, 5);
  const worst = [...games].sort((a, b) => a.pts - b.pts).slice(0, 5);
  const h = {};
  games.forEach(g => { const o = h[g.opp] ||= { opp: g.opp, w: 0, l: 0, t: 0, pf: 0, pa: 0, last: 0 }; o[g.res.toLowerCase()]++; o.pf += g.pts; o.pa += g.op; o.last = Math.max(o.last, g.s); });
  const h2h = Object.values(h).map(o => ({ ...o, gp: o.w + o.l + o.t, pct: (o.w + o.t / 2) / (o.w + o.l + o.t), dep: !F[o.opp].active })).sort((a, b) => b.gp - a.gp || b.pct - a.pct);
  const pl = {};
  D.lineups.forEach(([y, wk, ph, f, o, pid, slot, pts]) => { if (f !== fid || slot === 'BN') return; const p = pl[pid] ||= { pid, starts: 0, pts: 0 }; p.starts++; p.pts += pts; });
  const players = Object.values(pl).sort((a, b) => b.starts - a.starts || b.pts - a.pts).slice(0, 8).map(p => ({ ...p, ...D.players[p.pid] }));
  return { id: fid, fr, seasons, c, sb, best, worst, h2h, players, lost,
    span: `${seasons[0].s}–${seasons[seasons.length - 1].s}`, now: seasons[seasons.length - 1] };
}

function sgVM() {
  const T = {};
  const row = f => T[f] ||= { f, w: 0, l: 0, t: 0, pf: 0, pa: 0, mat: 0, seasons: new Set(), hs: -1, ls: 1e9, gap: false, lost: false };
  D.lines.forEach(([s, f, , w, l, t, pf, pa]) => { const r = row(f); r.w += w; r.l += l; r.t += t; r.pf += pf; r.pa += pa; r.mat += w + l + t; r.seasons.add(s); if (GAP.has(s)) r.gap = true; });
  D.games.forEach(([s, w, ph, a, pa, b, pb]) => {
    [[a, pa, pb], [b, pb, pa]].forEach(([f, me, op]) => {
      const r = row(f);
      if (me == null) { if (ph === 'P') r.lost = true; return; }
      r.hs = Math.max(r.hs, me); r.ls = Math.min(r.ls, me);
      if (ph !== 'P') return;
      r.mat++; r.pf += me; r.pa += op; me > op ? r.w++ : me < op ? r.l++ : r.t++;
    });
  });
  const rows = Object.values(T).map(r => ({ ...r, dep: !F[r.f].active, pct: (r.w + r.t / 2) / r.mat, ppg: r.pf / r.mat,
    span: `${Math.min(...r.seasons)}–${Math.max(...r.seasons)}`, name: F[r.f].name }));
  const [col, dir] = (P.get('sort') || 'w.desc').split('.');
  rows.sort((a, b) => { const x = a[col], y = b[col]; const c = typeof x === 'string' ? x.localeCompare(y) : x - y; return dir === 'asc' ? c : -c; });
  return { rows, col, dir };
}

      ${vm.rows.map(r => `<tr class="${r.dep ? 'dep' : ''}"><td class="num">${r.tied ? '=' : ''}${r.rank}</td>
        <td><a href="${fUrl(r.f)}">${esc(r.team)}</a>${r.team !== F[r.f].name ? `<span class="alias">${fname(r.f)}</span>` : ''}${r.dep ? C.bd.dep : ''}${r.now ? C.bd.now : ''}</td>
        <td><div class="bar"><i style="width:${(r.w / max) * 100}%"></i></div></td>
        <td class="num">${wlt(r)}${r.gap ? mk('†') : ''}</td><td class="num">${pct(r.pct)}</td><td class="num">${n2(r.ppg)}</td><td class="num">${seasonLink(r.s)}</td></tr>`).join('')}
      </tbody></table>${C.legend(vm.used, ['Regular season · 13 or 14 weeks'])}</div>
      <a class="ghost" href="#">Full list in Statsguru →</a>`);
  },
  franchise(vm) {
    const c = vm.c, fr = vm.fr;
    return C.shell(`<div class="crumb">Franchises</div>
      <h1><span style="margin-right:10px">${fr.emoji || '🏈'}</span>${esc(fr.name)}${fr.active ? C.bd.act : C.bd.dep}</h1>
      <div class="kpis">
        <div class="kpi"><span>Reg. season${mk('†')}</span><b>${wlt(c)}</b></div><div class="kpi"><span>Win %</span><b>${pct(c.pct)}</b></div>
        <div class="kpi"><span>PF / game</span><b>${n2(c.pf / c.gp)}</b></div><div class="kpi"><span>Breakdown %${mk('*')}</span><b>${pct(c.bdPct)}</b></div>
        <div class="kpi"><span>Playoffs</span><b>${c.po}</b></div><div class="kpi"><span>Shit Bowls</span><b>${c.sbTitles}</b></div></div>
      <div class="card"><h3>Win % by season · ${vm.span}</h3><div class="spark">${vm.seasons.map(o => `<div title="${o.s}: ${wlt(o)}${o.gap ? ' (reported totals)' : ''}"><i class="${o.gap ? 'gap' : o.now ? 'now' : o.po ? 'po' : ''}" style="height:${Math.max(4, (o.w + o.t / 2) / o.gp * 100)}%"></i>${String(o.s).slice(2)}</div>`).join('')}</div>
        ${C.legend([], ['<span style="color:#5ee3cf">■</span> Playoffs', '<span style="color:#2bb5a2">■</span> missed', '<span style="color:#6b5aa8">▨</span> † reported totals', '<span style="color:#f6ad55">■</span> this season'])}</div>
      <div class="card"><h3>Season by season</h3><table class="t"><thead><tr><th>Season</th><th>Team name</th><th class="num">W-L-T</th><th class="num">PF</th><th class="num">PA</th><th class="num">Breakdown</th><th class="num">Luck</th><th>Finish</th></tr></thead><tbody>
        ${vm.seasons.map(o => { const sb = vm.sb.find(x => x.s === o.s); return `<tr><td>${seasonLink(o.s)}${o.now ? C.bd.now : ''}</td><td>${esc(o.team)}</td><td class="num">${wlt(o)}${o.gap ? mk('†') : ''}</td><td class="num">${n2(o.pf)}</td><td class="num">${n2(o.pa)}</td>
          <td class="num">${o.bd ? wlt(o.bd) : '—'}</td><td class="num" style="color:${o.bd ? (o.luck > 0 ? '#5ee3cf' : '#ff8fa3') : ''}">${o.bd ? (o.luck > 0 ? '+' : '') + pct(o.luck) : '—'}</td><td>${o.po ? 'Playoffs' : ''}${sb ? 'Shit Bowl' + C.src(sb) : ''}</td></tr>`; }).join('')}
        </tbody></table>${C.legend(['†'])}</div>
      <div class="grid2">
        <div class="card"><h3>Best games${mk('*')}</h3><table class="t"><tbody>${vm.best.map(g => `<tr><td class="num" style="color:#5ee3cf">${n2(g.pts)}</td><td>v <a href="${fUrl(g.opp)}">${fname(g.opp)}</a></td><td class="num">${g.s} · W${g.w}</td></tr>`).join('')}</tbody></table></div>
        <div class="card"><h3>Worst games${mk('*')}</h3><table class="t"><tbody>${vm.worst.map(g => `<tr><td class="num" style="color:#ff8fa3">${n2(g.pts)}</td><td>v <a href="${fUrl(g.opp)}">${fname(g.opp)}</a></td><td class="num">${g.s} · W${g.w}</td></tr>`).join('')}</tbody></table></div>
        <div class="card"><h3>Bracket history</h3>${vm.sb.map(x => `<div style="padding:6px 0;border-bottom:1px solid #1a2333">${x.s} · Shit Bowl winner${C.src(x)}${x.disputed ? `<span class="alias">with ${x.others.map(fname).join(', ')}</span>` : ''}</div>`).join('')}
          ${vm.lost.filter(g => g.ph === 'P').map(g => `<div style="padding:6px 0;border-bottom:1px solid #1a2333">${g.s} · Playoffs W${g.w} v ${fname(g.opp)}${mk('‡')}</div>`).join('')}</div>
        ${vm.players.length ? `<div class="card"><h3>Most started${mk('¶')}</h3><table class="t"><tbody>${vm.players.map(p => `<tr><td><a href="#">${esc(p.name)}</a><span class="alias">${p.pos} · ${p.team}</span></td><td class="num">${p.starts} st</td><td class="num">${n2(p.pts)}</td></tr>`).join('')}</tbody></table></div>` : '<div></div>'}
      </div>
      <div class="card"><h3>Head-to-head</h3><table class="t"><thead><tr><th>Opponent</th><th class="num">Games</th><th class="num">W-L-T</th><th>Win %</th><th class="num">Last met</th></tr></thead><tbody>
        ${vm.h2h.map(o => `<tr class="${o.dep ? 'dep' : ''}"><td><a href="${fUrl(o.opp)}">${fname(o.opp)}</a>${o.dep ? C.bd.dep : ''}</td><td class="num">${o.gp}</td><td class="num">${wlt(o)}</td><td><div class="bar"><i style="width:${o.pct * 100}%"></i></div></td><td class="num">${o.last}</td></tr>`).join('')}
        </tbody></table>${C.legend(['†'], ['Games with scores only'])}</div>`);
  },
  statsguru(vm) {
    return C.shell(`<div class="crumb">Statsguru / Results</div><h1>Statsguru</h1>
      <div class="card qsum"><div class="chips" style="margin:0"><span class="chip on">Franchise records</span><span class="chip">Totals per franchise</span><span class="chip">2012–2025</span><span class="chip">Regular season</span><span class="chip">Playoffs</span></div><a class="btn" href="#">Edit query</a></div>
      <div class="card" style="padding:0 0 12px"><table class="t"><thead><tr>${SGCOLS.map(([k, l]) => `<th class="${k === 'name' || k === 'span' ? '' : 'num'} ${vm.col === k ? 'sorted' : ''}"><a href="${sortUrl(k, vm)}">${l}${k === 'hs' || k === 'ls' ? mk('*') : ''}${vm.col === k ? (vm.dir === 'desc' ? ' ↓' : ' ↑') : ''}</a></th>`).join('')}</tr></thead><tbody>
        ${vm.rows.map(r => `<tr class="${r.dep ? 'dep' : ''}">${SGCOLS.map(([k]) => k === 'name' ? `<td><a href="${fUrl(r.f)}">${F[r.f].emoji || '·'} ${esc(r.name)}</a>${r.gap ? mk('†') : ''}${r.lost ? mk('‡') : ''}${r.dep ? C.bd.dep : ''}</td>` : `<td class="${k === 'span' ? '' : 'num'}">${sgCell(r, k)}</td>`).join('')}</tr>`).join('')}
        </tbody></table><div style="padding:0 18px">${C.legend(['†', '‡', '*'], QNOTES)}</div></div>`);
  },
};

//__JS2__

// ---------- render ----------
const V = { A, B, C, D: Dv, E: Ev, F: Fv, G: Gv, H: Hv, I: Iv, J: B, K: B }[variant];
document.body.className = (variant === 'J' || variant === 'K' ? 'vB ' : '') + 'v' + variant;
const fid = +(P.get('f') || 15);
const vm = page === 'records' ? recordVM() : page === 'franchise' ? profileVM(F[fid] ? fid : 15) : sgVM();
document.getElementById('app').innerHTML = V[page](vm);
document.title = `PROTOTYPE · ${variant} ${VARIANTS[variant]} · ${PAGES[page]}`;

// ---------- prototype switcher ----------
const keys = Object.keys(VARIANTS);
const go = v => location.search = url({ variant: v });
const cycle = d => go(keys[(keys.indexOf(variant) + d + keys.length) % keys.length]);
document.getElementById('proto-bar').innerHTML = `<button id="pv">←</button><select id="vs">${Object.entries(VARIANTS).map(([k, l]) => `<option value="${k}" ${k === variant ? 'selected' : ''}>${k} · ${l}</option>`).join('')}</select><button id="nv">→</button><span class="sep"></span>
  ${Object.entries(PAGES).map(([k, l]) => `<button data-p="${k}" class="${k === page ? 'on' : ''}">${l}</button>`).join('')}`;
document.getElementById('vs').onchange = e => go(e.target.value);
document.getElementById('pv').onclick = () => cycle(-1);
document.getElementById('nv').onclick = () => cycle(1);
document.querySelectorAll('#proto-bar [data-p]').forEach(b => b.onclick = () => location.search = url({ page: b.dataset.p, sort: null }));
addEventListener('keydown', e => { if (e.target.closest('input,textarea,select,[contenteditable]')) return; if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1); });
</script>
</body>
</html>
