<!doctype html>
<!--
  PROTOTYPE (throwaway, never merged). Answers "Visual design: the site's look across
  records, profiles and Statsguru" (shmauk/tlgffl#15).
  Three radically different visual directions, switchable via ?variant=A|B|C, each rendering
  three pages via ?page=records|franchise|statsguru. Real ff-data-project data.
  The prototype treats 2025 as "this season" (the data stops there).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · visual design</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; }
a { color: inherit; }
.bd, .src { white-space: nowrap; }
.num { text-align: right; font-variant-numeric: tabular-nums lining-nums; white-space: nowrap; }
table { border-collapse: collapse; }

/* ---------- prototype switcher (not part of the design) ---------- */
#proto-bar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 99;
  display: flex; gap: 10px; align-items: center; background: #111; color: #fff; border: 2px solid #ff3d7f;
  border-radius: 999px; padding: 6px 10px; font: 600 13px/1 system-ui, sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
#proto-bar button { white-space: nowrap; background: #333; color: #fff; border: 0; border-radius: 999px; padding: 6px 10px; cursor: pointer; font: inherit; }
#proto-bar button.on { background: #ff3d7f; }
#proto-bar .lbl { min-width: 150px; text-align: center; }
#proto-bar .sep { width: 1px; height: 20px; background: #555; }

/* =================== A: Scorecard (Cricinfo-modern) =================== */
.vA { background: #fff; color: #1d2329; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.vA .top { background: #0b4f3a; color: #fff; }
.vA .top .in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 28px; padding: 0 16px; height: 48px; }
.vA .brand { font-weight: 800; font-size: 16px; letter-spacing: -.01em; text-decoration: none; }
.vA .brand small { font-weight: 500; opacity: .7; margin-left: 6px; font-size: 12px; }
.vA .top nav a { text-decoration: none; opacity: .85; padding: 15px 0; border-bottom: 3px solid transparent; font-weight: 600; }
.vA .top nav { display: flex; gap: 20px; }
.vA .top nav a.on { opacity: 1; border-color: #f2b632; }
.vA main { max-width: 1120px; margin: 0 auto; padding: 14px 16px 90px; }
.vA .crumb { color: #6b7580; font-size: 12px; margin-bottom: 6px; }
.vA .crumb a { color: #1667b7; text-decoration: none; }
.vA h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.01em; }
.vA h2 { font-size: 14px; margin: 22px 0 6px; padding-bottom: 4px; border-bottom: 2px solid #0b4f3a; text-transform: uppercase; letter-spacing: .04em; }
.vA .sub { color: #5b6570; margin-bottom: 10px; }
.vA .seg { display: inline-flex; border: 1px solid #c9d1d9; border-radius: 4px; overflow: hidden; margin: 6px 12px 10px 0; }
.vA .seg a { padding: 4px 10px; text-decoration: none; color: #1d2329; border-right: 1px solid #c9d1d9; }
.vA .seg a:last-child { border-right: 0; }
.vA .seg a.on { background: #0b4f3a; color: #fff; }
.vA table.t { width: 100%; }
.vA .t th { background: #eef1f4; color: #4a545e; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; text-align: left; padding: 6px 8px; border-bottom: 1px solid #d5dbe1; white-space: nowrap; }
.vA .t th.num { text-align: right; }
.vA .t th a { text-decoration: none; }
.vA .t th.sorted { color: #0b4f3a; }

.vA .t td a, .vA .lnk { color: #1667b7; text-decoration: none; }
.vA .t td a:hover { text-decoration: underline; }
.vA .t .fr { font-weight: 600; }
.vA .t .alias { color: #6b7580; font-size: 12px; margin-left: 4px; }
.vA .mk { color: #c0392b; font-weight: 700; font-size: 10px; margin-left: 1px; cursor: help; }
.vA .bd { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 1px 5px; border-radius: 3px; margin-left: 6px; vertical-align: 1px; }
.vA .bd-now { background: #f2b632; color: #3d2c00; }
.vA .bd-dep { border: 1px solid #aab3bc; color: #6b7580; }
.vA .bd-act { background: #dff3ea; color: #0b4f3a; }
.vA .src { display: inline-block; font-size: 11px; font-style: italic; color: #6b7580; border-bottom: 1px dotted #6b7580; margin-left: 6px; cursor: help; }
.vA .src.disp { color: #b03a2e; border-color: #b03a2e; font-style: normal; font-weight: 600; }
.vA .notes { background: #f6f7f9; border-left: 3px solid #0b4f3a; padding: 8px 12px; margin-top: 10px; font-size: 12px; color: #3d4650; }
.vA .notes b.g { color: #c0392b; display: inline-block; width: 14px; }
.vA .notes div { margin: 2px 0; }
.vA .more { margin-top: 10px; display: inline-block; font-weight: 600; }
.vA .qbar { background: #eef1f4; border: 1px solid #d5dbe1; border-radius: 4px; padding: 8px 12px; margin: 8px 0 12px; display: flex; justify-content: space-between; gap: 10px; }
.vA .prof-head { display: flex; gap: 16px; align-items: center; padding: 6px 0 12px; border-bottom: 1px solid #e3e7eb; }
.vA .emoji { font-size: 44px; width: 64px; height: 64px; display: grid; place-items: center; background: #eef1f4; border-radius: 8px; }
.vA .grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; }
.vA .kv td { padding: 4px 6px; border-bottom: 1px solid #eceff2; }
.vA .kv td:first-child { color: #6b7580; }
.vA .kv { width: 100%; }
.vA ul.plain { list-style: none; padding: 0; margin: 0; }
.vA ul.plain li { padding: 4px 0; border-bottom: 1px solid #eceff2; }

/* =================== B: Almanack (Wisden) =================== */
.vB { background: #fbf8f1; color: #1b1a17; font: 16px/1.5 "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; }
.vB header { text-align: center; padding: 34px 16px 0; }
.vB .kicker { font-variant: small-caps; letter-spacing: .14em; font-size: 15px; color: #6e2a1f; text-transform: lowercase; }
.vB .title { font-size: 44px; line-height: 1.05; margin: 2px 0 10px; font-weight: 400; letter-spacing: .01em; }
.vB .title a { text-decoration: none; }
.vB nav { border-top: 1px solid #1b1a17; border-bottom: 3px double #1b1a17; max-width: 760px; margin: 0 auto; padding: 6px 0; display: flex; justify-content: center; gap: 26px; font-variant: small-caps; text-transform: lowercase; letter-spacing: .1em; }
.vB nav a { text-decoration: none; color: #4a463e; }
.vB nav a.on { color: #1b1a17; font-weight: 700; }
.vB main { max-width: 760px; margin: 0 auto; padding: 26px 16px 110px; }
.vB main.wide { max-width: 960px; }
.vB h1 { font-weight: 400; font-style: italic; font-size: 30px; margin: 0; text-align: center; }

.vB .filters a { text-decoration: none; margin: 0 6px; }
.vB .filters a.on { color: #1b1a17; font-weight: 700; border-bottom: 1px solid #1b1a17; }
.vB h2 { font-weight: 400; font-variant: small-caps; text-transform: lowercase; letter-spacing: .1em; font-size: 19px; margin: 34px 0 6px; text-align: center; }

.vB table.t { width: 100%; border-top: 1.5px solid #1b1a17; border-bottom: 1.5px solid #1b1a17; font-size: 15px; }
.vB .t th { font-weight: 400; font-variant: small-caps; text-transform: lowercase; letter-spacing: .05em; color: #4a463e; text-align: left; padding: 6px 6px 4px; border-bottom: .5px solid #1b1a17; white-space: nowrap; }
.vB .t th.num { text-align: right; }
.vB .t th a { text-decoration: none; }
.vB .t th.sorted { color: #6e2a1f; text-decoration: underline; }
.vB .t td { padding: 3px 6px; vertical-align: baseline; }
.vB .t td a { text-decoration: none; }
.vB .t td a:hover { text-decoration: underline; }
.vB .t tr.now td { font-weight: 700; }
.vB .t tr.dep .fr { font-style: italic; }
.vB .alias { color: #6c665a; font-size: 13px; }
.vB .mk { font-size: 11px; vertical-align: super; line-height: 0; margin-left: 1px; cursor: help; }
.vB .bd { font-variant: small-caps; text-transform: lowercase; letter-spacing: .06em; font-size: 14px; margin-left: 6px; font-weight: 400; font-style: normal; }
.vB .bd-now { color: #6e2a1f; }
.vB .bd-dep { color: #6c665a; }
.vB .src { font-style: italic; color: #6c665a; font-size: 14px; }
.vB .src.disp { font-style: normal; font-variant: small-caps; text-transform: lowercase; letter-spacing: .06em; color: #6e2a1f; }
.vB .foot { font-size: 13px; color: #3d3a33; margin-top: 8px; line-height: 1.45; }
.vB .foot div { padding-left: 16px; text-indent: -16px; }
.vB .foot .g { display: inline-block; width: 16px; text-indent: 0; }
.vB .more { display: block; text-align: right; font-style: italic; font-size: 14px; margin-top: 6px; }
.vB .prose { text-align: justify; hyphens: auto; }
.vB .prose::first-letter { font-size: 3.1em; float: left; line-height: .9; padding: 4px 6px 0 0; color: #6e2a1f; }
.vB .name { text-align: center; font-variant: small-caps; text-transform: lowercase; font-size: 36px; letter-spacing: .06em; margin: 0; font-weight: 400; }
.vB .meta { text-align: center; color: #5a554b; font-style: italic; margin-bottom: 18px; }
.vB .cols { columns: 2; column-gap: 32px; font-size: 14px; }
.vB .query { text-align: center; font-style: italic; margin: 0 0 16px; }
.vB .two { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }

/* =================== C: Night desk (dark data app) =================== */
.vC { background: #0e131d; color: #dfe5ee; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; }
.vC .shell { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: 100vh; }
.vC aside { background: #0a0e16; border-right: 1px solid #1d2636; padding: 18px 12px; position: sticky; top: 0; height: 100vh; }
.vC .logo { font-weight: 800; font-size: 15px; padding: 0 8px 18px; color: #fff; }
.vC .logo span { display: block; font-weight: 500; font-size: 11px; color: #7d8aa0; letter-spacing: .12em; text-transform: uppercase; }
.vC aside a { display: flex; gap: 10px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: #a9b4c6; margin-bottom: 2px; }
.vC aside a.on { background: #18263a; color: #5ee3cf; }
.vC aside a:hover { background: #131c2b; }
.vC main { padding: 22px 28px 110px; max-width: 1200px; }
.vC .crumb { color: #7d8aa0; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; }
.vC h1 { font-size: 26px; margin: 2px 0 14px; color: #fff; letter-spacing: -.02em; }
.vC .card { background: #141b28; border: 1px solid #1f2a3d; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
.vC .card h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: #7d8aa0; font-weight: 600; }
.vC .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.vC .chip { padding: 4px 12px; border-radius: 999px; background: #18212f; border: 1px solid #263247; color: #a9b4c6; text-decoration: none; font-size: 13px; }
.vC .chip.on { background: #5ee3cf; color: #062a26; border-color: #5ee3cf; font-weight: 700; }
.vC table.t { width: 100%; font-size: 13.5px; }
.vC .t th { position: sticky; top: 0; background: #141b28; text-align: left; color: #7d8aa0; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 8px 10px; border-bottom: 1px solid #263247; white-space: nowrap; }
.vC .t th.num { text-align: right; }
.vC .t th a { text-decoration: none; }
.vC .t th.sorted { color: #5ee3cf; }
.vC .t td { padding: 9px 10px; border-bottom: 1px solid #1a2333; }
.vC .t td.num { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
.vC .t tbody tr:hover td { background: #18212f; }
.vC .t tr.dep td { opacity: .55; }
.vC .t td a { color: #e9eef6; text-decoration: none; }
.vC .t td a:hover { color: #5ee3cf; }
.vC .alias { color: #7d8aa0; font-size: 12px; margin-left: 6px; }
.vC .mk { display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding: 0 3px; margin-left: 5px; border-radius: 4px; background: #2a2440; color: #c3a6ff; font-size: 11px; font-weight: 700; vertical-align: 1px; cursor: help; font-family: system-ui, sans-serif; }
.vC .bd { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; margin-left: 8px; vertical-align: 1px; }
.vC .bd-now { background: #f6ad55; color: #2d1800; box-shadow: 0 0 10px rgba(246,173,85,.45); }
.vC .bd-dep { background: #262f3f; color: #8e9ab0; }
.vC .bd-act { background: #0f3a33; color: #5ee3cf; }

.vC .src.disp { background: #3a1d24; color: #ff8fa3; }
.vC .bar { position: relative; height: 6px; background: #1f2a3d; border-radius: 3px; min-width: 90px; }

.vC .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: #9aa6ba; margin-top: 12px; }

.vC .kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.vC .kpi { background: #141b28; border: 1px solid #1f2a3d; border-radius: 12px; padding: 12px 14px; }

.vC .kpi span { font-size: 11px; color: #7d8aa0; text-transform: uppercase; letter-spacing: .08em; }
.vC .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.vC .spark { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-top: 10px; }
.vC .spark div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font-size: 10px; color: #7d8aa0; }
.vC .spark i { width: 100%; border-radius: 4px 4px 0 0; background: #2bb5a2; display: block; }
.vC .spark i.gap { background: repeating-linear-gradient(135deg, #6b5aa8 0 4px, #2a2440 4px 8px); }
.vC .spark i.po { background: #5ee3cf; }
.vC .spark i.now { background: #f6ad55; }
.vC .qsum { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.vC .btn { background: #5ee3cf; color: #062a26; padding: 6px 14px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 13px; }
.vC .ghost { color: #5ee3cf; text-decoration: none; font-weight: 600; }
/* =================== B variations: J yellow jacket, K lamplight =================== */

.vD .t th.sorted { color: #c4151c; }

.vD .t a { text-decoration: none; }

.vD .t .fr { font-weight: 700; }
.vD .alias { color: #555; }
.vD .mk { color: #c4151c; font-weight: 700; font-size: 10px; vertical-align: super; line-height: 0; cursor: help; }

.vD .bd.now { background: #c4151c; color: #fff; }

.vD .bd.act { background: #111; color: #f4f1ea; }

.vD .notes { font-size: 13px; }

function recParts(vm, T) {
  return {
    title: 'Fewest wins in a season', sub: 'Regular season · the ten lowest, plus anyone tied with 10th',
    filters: `<div class="filters">${ERAS.map(([k, l]) => `<a class="${vm.era === k ? 'on' : ''}" href="${url({ era: k === 'all' ? null : k })}">${l}</a>`).join(T.sep)}</div>`,
    table: tbl([
      { h: '#', num: 1, cell: r => (r.tied ? '=' : '') + r.rank },
      { h: 'Team', cell: r => `<a class="fr" href="${fUrl(r.f)}">${esc(r.team)}</a>${r.team !== F[r.f].name ? ` <span class="alias">(${fname(r.f)})</span>` : ''}${r.dep ? T.bd.dep : ''}${r.now ? T.bd.now : ''}` },
      { h: 'W-L-T', num: 1, cell: r => wlt(r) + (r.gap ? mk('†') : '') },
      { h: 'Win %', num: 1, cell: r => pct(r.pct) },
      { h: 'PF/G', num: 1, cell: r => n2(r.ppg) },
      { h: 'Season', num: 1, cell: r => seasonLink(r.s) },
    ], vm.rows, rowCls),
    noteList: [vm.used, ['Season lengths differ (13 or 14 weeks), so wins are raw counts.']],
    more: `<a class="more" href="#">Full list in Statsguru →</a>`,
    top: vm.rows[0],
  };
}

function profParts(vm, T) {
  const c = vm.c, sbOf = s => vm.sb.find(x => x.s === s);
  const gamesTbl = gs => tbl([
    { h: 'Pts', num: 1, cell: g => n2(g.pts) }, { h: 'Opponent', cell: g => `v <a href="${fUrl(g.opp)}">${fname(g.opp)}</a>` }, { h: 'When', num: 1, cell: g => `${g.s} wk ${g.w}` },
  ], gs);
  return {
    name: esc(vm.fr.name), emoji: vm.fr.emoji || '🏈', status: vm.fr.active ? T.bd.act : T.bd.dep,
    meta: `${vm.seasons.length} seasons, ${vm.span}`, sg: `<a class="more" href="${url({ page: 'statsguru', f: vm.id })}">Open in Statsguru →</a>`,
    kv: [['Regular season', wlt(c) + mk('†')], ['Win %', pct(c.pct)], ['PF per game', n2(c.pf / c.gp)], ['PA per game', n2(c.pa / c.gp)], ['Breakdown %', pct(c.bdPct) + mk('*')], ['Playoff appearances', c.po], ['Shit Bowl winner titles', c.sbTitles]],
    seasons: tbl([
      { h: 'Season', cell: o => seasonLink(o.s) + (o.now ? T.bd.now : '') }, { h: 'Team name', cell: o => esc(o.team) },
      { h: 'W-L-T', num: 1, cell: o => wlt(o) + (o.gap ? mk('†') : '') }, { h: 'PF', num: 1, cell: o => n2(o.pf) }, { h: 'PA', num: 1, cell: o => n2(o.pa) },
      { h: 'Breakdown', num: 1, cell: o => o.bd ? wlt(o.bd) : '–' }, { h: 'Luck', num: 1, cell: o => o.bd ? (o.luck > 0 ? '+' : '') + pct(o.luck) : '–' },
      { h: 'Finish', cell: o => (o.po ? 'Playoffs' : '') + (sbOf(o.s) ? 'Shit Bowl' + T.src(sbOf(o.s)) : '') },
    ], vm.seasons, o => o.now ? 'now' : ''),
    bracket: [...vm.sb.map(x => `${seasonLink(x.s)} Shit Bowl winner${T.src(x)}${x.disputed ? ` <span class="alias">with ${x.others.map(fname).join(', ')}</span>` : ''}`),
      ...vm.lost.filter(g => g.ph === 'P').map(g => `${seasonLink(g.s)} Playoffs wk ${g.w} v ${fname(g.opp)}${mk('‡')}`)],
    best: gamesTbl(vm.best), worst: gamesTbl(vm.worst),
    h2h: tbl([
      { h: 'Opponent', cell: o => `<a class="fr" href="${fUrl(o.opp)}">${fname(o.opp)}</a>${o.dep ? T.bd.dep : ''}` }, { h: 'Games', num: 1, cell: o => o.gp },
      { h: 'W-L-T', num: 1, cell: o => wlt(o) }, { h: 'Win %', num: 1, cell: o => pct(o.pct) }, { h: 'Last met', num: 1, cell: o => o.last },
    ], vm.h2h, o => o.dep ? 'dep' : ''),
    players: vm.players.length ? tbl([
      { h: 'NFL player', cell: p => `<a href="#">${esc(p.name)}</a> <span class="alias">${p.pos}</span>` }, { h: 'Starts', num: 1, cell: p => p.starts }, { h: 'Pts', num: 1, cell: p => n2(p.pts) },
    ], vm.players) : '',
    names: vm.seasons.map(o => `${o.s} <i>${esc(o.team)}</i>`).join('; '),
  };
}

function sgParts(vm, T) {
  return {
    query: SGQUERY, edit: '<a class="more" href="#">Edit query</a>',
    table: tbl(SGCOLS.map(([k, l]) => ({
      h: `<a href="${sortUrl(k, vm)}">${l}${k === 'hs' || k === 'ls' ? '*' : ''}${vm.col === k ? (vm.dir === 'desc' ? ' ▾' : ' ▴') : ''}</a>`, num: !(k === 'name' || k === 'span'), sorted: vm.col === k,
      cell: r => k === 'name' ? `<a class="fr" href="${fUrl(r.f)}">${esc(r.name)}</a>${r.gap ? mk('†') : ''}${r.lost ? mk('‡') : ''}${r.dep ? T.bd.dep : ''}` : sgCell(r, k),
    })), vm.rows, r => r.dep ? 'dep' : ''),
    noteList: [['†', '‡', '*'], QNOTES],
  };
}

// D: Broadsheet
// =====================================================================
const TD = theme({ now: 'This season', dep: 'dep.', act: 'Active', rec: 'recalled', disp: 'Disputed', sep: ' &nbsp;|&nbsp; ' });
const Dv = {
  shell: body => `<div class="mast"><div class="dateline"><span>Monday 12 October 2026</span><span>The Fantasy League · est. 2012</span><span>Daily edition</span></div>
    <div class="mtitle">The Record Book</div><nav>${navLinks()}</nav></div><main>${body}</main>`,
  records(vm) { const p = recParts(vm, TD);
    return Dv.shell(`<div class="kick">Records · Seasons</div><h1>${p.title}</h1><div class="deck">${p.sub}</div>${p.filters}
      <div class="cols3"><div>${p.table}</div><div><h4>The small print</h4>${TD.notes(...p.noteList)}${p.more}</div></div>`); },
  franchise(vm) { const p = profParts(vm, TD);
    return Dv.shell(`<div class="kick">Franchises ${p.status}</div><h1>${p.emoji} ${p.name}</h1><div class="deck">${p.meta}. ${p.sg}</div>
      <div class="full"><h4>Season by season</h4>${p.seasons}${TD.notes(['†'])}</div>
      <div class="paper"><section><h4>Career</h4>${kvTable(p.kv)}</section><section><h4>Bracket history</h4>${p.bracket.map(b => `<div>${b}</div>`).join('')}</section>
        <section><h4>Best games${mk('*')}</h4>${p.best}</section><section><h4>Worst games${mk('*')}</h4>${p.worst}</section>
        ${p.players ? `<section><h4>Most started${mk('¶')}</h4>${p.players}</section>` : ''}<section><h4>Team names</h4><div style="font-size:13px">${p.names}</div></section></div>
      <div class="full"><h4>Head-to-head</h4>${p.h2h}${TD.notes(['†'], ['Games with scores only.'])}</div>`); },
  statsguru(vm) { const p = sgParts(vm, TD);
    return Dv.shell(`<div class="kick">Statsguru</div><h1>The query</h1><div class="deck">${p.query}. ${p.edit}</div>
      <div class="cols3" style="grid-template-columns:3fr 1fr"><div>${p.table}</div><div><h4>The small print</h4>${TD.notes(...p.noteList)}</div></div>`); },
};

// E: Ceefax
// =====================================================================
const TE = theme({ now: 'NEW', dep: 'GONE', act: 'ACTIVE', rec: '(RECALLED)', disp: 'DISPUTED', sep: '' });
const PAGENO = { records: 302, franchise: 315, statsguru: 340 };
const Ev = {
  shell: (title, right, body) => `<div class="scr"><div class="hdr"><span>P${PAGENO[page]}</span><span><b>CEEFAX</b> ${PAGENO[page]}</span><span>Mon 12 Oct <b>21:14/32</b></span></div>
    <div class="band"><h1>${title}</h1><span>${right}</span></div>${body}
    <div class="fast"><a style="color:#f00" href="${navHref('records')}">Records</a><a style="color:#0f0" href="${navHref('franchise')}">Franchises</a><a style="color:#ff0" href="${navHref('statsguru')}">Statsguru</a><a style="color:#0ff" href="#">League</a></div></div>`,
  records(vm) { const p = recParts(vm, TE);
    return Ev.shell('Fewest wins', 'RECORDS', `<div class="sub">${p.sub}</div>${p.filters}${p.table}${TE.notes(...p.noteList)}${p.more}`); },
  franchise(vm) { const p = profParts(vm, TE);
    return Ev.shell(p.name, 'FRANCHISES', `<div class="sub">${p.meta} ${p.status}</div>${kvTable(p.kv)}
      <h2>Season by season</h2>${p.seasons}${TE.notes(['†'])}
      <h2>Bracket history</h2>${p.bracket.map(b => `<div>${b}</div>`).join('')}
      <div class="two"><div><h2>Best games${mk('*')}</h2>${p.best}</div><div><h2>Worst games${mk('*')}</h2>${p.worst}</div></div>
      <h2>Head-to-head</h2>${p.h2h}${p.players ? `<h2>Most started${mk('¶')}</h2>${p.players}` : ''}`); },
  statsguru(vm) { const p = sgParts(vm, TE);
    return Ev.shell('Statsguru', 'RESULTS', `<div class="sub">${p.query}</div>${p.table}${TE.notes(...p.noteList)}${p.edit}`); },
};

// =====================================================================
// F: Swiss
// =====================================================================
const TF = theme({ now: '● This season', dep: 'Departed', act: 'Active', rec: 'recalled', disp: 'Disputed', sep: '' });
const row = (lab, con) => `<div class="row"><div class="lab">${lab}</div><div>${con}</div></div>`;
const Fv = {
  shell: body => `<div class="top"><div class="logo">The Fantasy League</div><nav>${navLinks()}</nav></div><main>${body}</main>`,
  records(vm) { const p = recParts(vm, TF), t = p.top;
    return Fv.shell(row('Records<small>Seasons</small>', `<h1>${p.title}</h1>${p.filters}`) +
      row(`The record<small>${esc(t.team)}, ${t.s}${t.dep ? ' (departed)' : ''}</small>`, `<div class="huge">${t.w}–${t.l}</div>`) +
      row(`Top ten<small>${p.sub}</small>`, p.table + TF.notes(...p.noteList) + p.more)); },
  franchise(vm) { const p = profParts(vm, TF);
    return Fv.shell(row(`Franchise<small>${p.meta}<br>${p.status}</small>`, `<h1>${p.name}</h1>${p.sg}`) +
      row('Career', `<div class="kpis">${p.kv.map(([k, v]) => `<div><b>${v}</b><span>${k}</span></div>`).join('')}</div>`) +
      row('Season by season', p.seasons + TF.notes(['†'])) +
      row('Bracket history', p.bracket.map(b => `<div>${b}</div>`).join('')) +
      row(`Games<small>Highs and lows only come from games with scores${mk('*')}</small>`, `<div class="two"><div>${p.best}</div><div>${p.worst}</div></div>`) +
      row('Head-to-head', p.h2h + TF.notes(['†'], ['Games with scores only.'])) +
      (p.players ? row(`Most started${mk('¶')}`, p.players) : '')); },
  statsguru(vm) { const p = sgParts(vm, TF);
    return Fv.shell(row('Statsguru<small>Results</small>', `<h1>Totals per franchise</h1><div style="margin-top:10px">${p.query} · ${p.edit}</div>`) + row('Results', p.table + TF.notes(...p.noteList))); },
};

// =====================================================================
// G: Sidenotes (Tufte)
// =====================================================================
const TG = theme({ now: 'this season', dep: 'departed', act: 'in the league', rec: 'recalled', disp: 'disputed', sep: ' · ' });
const side = (gs, extra = []) => `<aside class="side">${gs.map(g => `<div><span class="g">${g}</span>${NOTE[g]}</div>`).join('')}${extra.map(e => `<div>${e}</div>`).join('')}</aside>`;
const sect = (main, notes) => `<div class="sect"><div>${main}</div>${notes}</div>`;
const Gv = {
  shell: body => `<div class="wrap"><div class="site"><a href="${url({ page: 'records' })}">The Fantasy League — a record book</a></div><nav>${navLinks()}</nav>${body}</div>`,
  records(vm) { const p = recParts(vm, TG);
    return Gv.shell(`<h1>${p.title}</h1><div class="sub">${p.sub}</div>${p.filters}` + sect(p.table + p.more, side(...p.noteList))); },
  franchise(vm) { const p = profParts(vm, TG), c = vm.c;
    return Gv.shell(`<h1>${p.name}</h1><div class="sub">${p.meta} · ${p.status}</div>` +
      sect(`<p>${p.name} have won ${c.w} and lost ${c.l} regular-season games${mk('†')}, a win rate of ${pct(c.pct)}%. Playing the whole league every week, they would have won ${pct(c.bdPct)}%${mk('*')}. They have reached the Playoffs ${c.po} times and been crowned Shit Bowl winner ${c.sbTitles} times.</p>${p.sg}`, `<aside class="side">${kvTable(p.kv)}</aside>`) +
      `<h2>Season by season</h2>` + sect(p.seasons, side(['†'], ['Breakdown and luck need every game, so the seasons with gaps are blank.', 'Disputed outcomes count for nobody until the league settles them; recalled ones come from memory.'])) +
      `<h2>Bracket history</h2>` + sect(p.bracket.map(b => `<div>${b}</div>`).join(''), side(['‡'])) +
      `<h2>Best and worst games</h2>` + sect(`<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">${p.best}${p.worst}</div>`, side(['*'])) +
      `<h2>Head-to-head</h2>` + sect(p.h2h, side(['†'], ['Games with scores only.'])) +
      (p.players ? `<h2>Most started</h2>` + sect(p.players, side(['¶'])) : '')); },
  statsguru(vm) { const p = sgParts(vm, TG);
    return Gv.shell(`<h1>Statsguru</h1><div class="sub">${p.query}. ${p.edit}</div>` + sect(p.table, side(...p.noteList))); },
};

      <h2>Head-to-head</h2>${p.h2h}${p.players ? `<h2>Most started${mk('¶')}</h2>${p.players}` : ''}`); },

// I: Programme

const TI = theme({ now: 'This season', dep: 'Departed', act: 'Active', rec: 'recalled', disp: 'Disputed', sep: '' });
const box = (h, b, pad = true) => `<div class="box"><div class="bh">${h}</div>${pad ? `<div class="bi">${b}</div>` : b}</div>`;
const Iv = {
  shell: body => `<header><div class="in"><div class="ttl">The Fantasy League<small>Official record book</small></div><nav>${navLinks()}</nav></div></header><main>${body}</main>`,
  records(vm) { const p = recParts(vm, TI);
    return Iv.shell(`<h1>${p.title}</h1><div class="sub">${p.sub}</div>${p.filters}` + box('Top ten', p.table + TI.notes(...p.noteList) + p.more, false)); },
  franchise(vm) { const p = profParts(vm, TI);
    return Iv.shell(`<div class="hero"><div class="crest">${p.emoji}</div><div><h1>${p.name}</h1><div class="sub">${p.meta} ${p.status}</div>${p.sg}</div></div>
      <div class="two">${box('Career', kvTable(p.kv))}${box('Bracket history', p.bracket.map(b => `<div>${b}</div>`).join(''))}</div>
      ${box('Season by season', p.seasons + TI.notes(['†']), false)}
      <div class="two">${box(`Best games${mk('*')}`, p.best, false)}${box(`Worst games${mk('*')}`, p.worst, false)}</div>
      ${box('Head-to-head', p.h2h + TI.notes(['†'], ['Games with scores only.']), false)}${p.players ? box(`Most started${mk('¶')}`, p.players, false) : ''}`); },
  statsguru(vm) { const p = sgParts(vm, TI);
    return Iv.shell(`<h1>Statsguru</h1><div class="sub">${p.query}. ${p.edit}</div><br>` + box('Results', p.table + TI.notes(...p.noteList), false)); },
};


// ---------- render ----------
const V = { A, B, C, D: Dv, E: Ev, F: Fv, G: Gv, H: Hv, I: Iv, J: B, K: B }[variant];
document.body.className = (variant === 'J' || variant === 'K' ? 'vB ' : '') + 'v' + variant;
const fid = +(P.get('f') || 15);
const vm = page === 'records' ? recordVM() : page === 'franchise' ? profileVM(F[fid] ? fid : 15) : sgVM();
document.getElementById('app').innerHTML = V[page](vm);
document.title = `PROTOTYPE · ${variant} ${VARIANTS[variant]} · ${PAGES[page]}`;

// ---------- prototype switcher ----------
const keys = Object.keys(VARIANTS);
const go = v => location.search = url({ variant: v });
const cycle = d => go(keys[(keys.indexOf(variant) + d + keys.length) % keys.length]);
document.getElementById('proto-bar').innerHTML = `<button id="pv">←</button><select id="vs">${Object.entries(VARIANTS).map(([k, l]) => `<option value="${k}" ${k === variant ? 'selected' : ''}>${k} · ${l}</option>`).join('')}</select><button id="nv">→</button><span class="sep"></span>
  ${Object.entries(PAGES).map(([k, l]) => `<button data-p="${k}" class="${k === page ? 'on' : ''}">${l}</button>`).join('')}`;
document.getElementById('vs').onchange = e => go(e.target.value);
document.getElementById('pv').onclick = () => cycle(-1);
document.getElementById('nv').onclick = () => cycle(1);
document.querySelectorAll('#proto-bar [data-p]').forEach(b => b.onclick = () => location.search = url({ page: b.dataset.p, sort: null }));
addEventListener('keydown', e => { if (e.target.closest('input,textarea,select,[contenteditable]')) return; if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1); });
</script>
